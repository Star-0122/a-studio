<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aスタジオ｜動画ハブ</title>
<meta name="description" content="Aスタジオの動画を検索・カテゴリー別に探せる拡張ページ">
<style>
:root{--ink:#333;--paper:#fffdf8;--accent:#f18d73;--line:#eadfd5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}header{padding:24px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:#fff}header a{color:inherit;text-decoration:none}.brand{font-weight:800;font-size:20px}.back{font-size:14px}main{max-width:1000px;margin:auto;padding:48px 6%}.eyebrow{font-size:12px;letter-spacing:.15em;color:#9b8b80;text-transform:uppercase}h1{font-size:clamp(30px,5vw,52px);margin:10px 0}.lead{color:#75685f}.controls{display:grid;grid-template-columns:1fr 180px;gap:12px;margin:30px 0}input,select{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.count{font-size:13px;color:#8c7c72;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0000000d}.tag{display:inline-block;font-size:11px;padding:6px 9px;border-radius:999px;background:#f8e6df;color:#9b5e4d}.card h2{font-size:19px;margin:16px 0 8px}.card p{margin:0;color:#8b7c73;font-size:13px}.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:#8b7c73;grid-column:1/-1}@media(max-width:700px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}main{padding-top:30px}}
</style>
</head>
<body>
<header><a class="brand" href="../">Aスタジオ</a><a class="back" href="https://www.canva.com/">メインサイトへ</a></header>
<main>
<div class="eyebrow">A Studio / Future Hub</div>
<h1>動画を探す</h1>
<p class="lead">Aスタジオの動画を、年・カテゴリー・タイトルからすぐに見つけられる拡張ページです。</p>
<div class="controls"><input id="q" type="search" placeholder="動画名を検索…"><select id="cat"><option value="">すべてのカテゴリー</option><option>Summer vacation</option><option>New Year's</option><option>Travel</option><option>Event</option><option>Memory</option><option>Others</option></select></div>
<div class="count" id="count"></div><div class="grid" id="grid"></div>
</main>
<script>
const grid=document.querySelector('#grid'),q=document.querySelector('#q'),cat=document.querySelector('#cat'),count=document.querySelector('#count');let movies=[];
function render(){const query=q.value.trim().toLowerCase();const filtered=movies.filter(m=>(!query||(m.title+m.category).toLowerCase().includes(query))&&(!cat.value||m.category===cat.value));count.textContent=`${filtered.length}件`;grid.innerHTML=filtered.length?filtered.map(m=>`<a class="card" href="${m.url||'#'}" ${m.url?'target="_blank" rel="noopener"':''} onclick="if(!this.getAttribute('href')||this.getAttribute('href')==='#')return false"><span class="tag">${m.category}</span><h2>${m.title}</h2><p>${m.year}年｜${m.status==='published'?'公開':'準備中'}</p></a>`).join(''):'<div class="empty">該当する動画がありません。</div>'}
q.addEventListener('input',render);cat.addEventListener('change',render);fetch('../data/movies.json').then(r=>r.json()).then(d=>{movies=d;render()}).catch(()=>{grid.innerHTML='<div class="empty">動画データを読み込めませんでした。</div>'});
</script>
</body></html>
